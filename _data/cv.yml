        highlights:
          - Scientific Lead
          - Pre-maturation project
          - EUR 50k
          - Robotic construction
          - Raw-earth materials
          - Adaptive robotic control

      - name: ITA - Inclusivité en Terre Additive
        summary: >
          Robotic additive manufacturing using locally sourced earth materials
          for sustainable construction.
        highlights:
