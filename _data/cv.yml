          - Approx. EUR 362k
          - Multi-physics monitoring
          - Artificial intelligence and computer vision
          - Digital models and adaptive manufacturing

      - name: Ecobrick 4.0
        summary: >
          Robotisation and adaptive control of raw-earth brick construction using
