  summary: >
    Associate Professor in Mechanical Engineering at Nantes Université
    and researcher at LS2N UMR CNRS 6004. My research and teaching activities
    lie at the intersection of robotic additive manufacturing, large-scale
    manufacturing, artificial intelligence, computer vision, process monitoring,
    digital twins and sustainable construction.

